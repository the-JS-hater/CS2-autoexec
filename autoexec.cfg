//====================================================
// CS2 Autoexec
// Generated from current configuration
//====================================================

//----------------------------------------------------
// General
//----------------------------------------------------
con_enable true
name "M0rr1z [ON-BAS]"

//----------------------------------------------------
// Mouse
//----------------------------------------------------
sensitivity 0.5
zoom_sensitivity_ratio 1.0
m_pitch 0.022
m_yaw 0.022

//----------------------------------------------------
// Viewmodel
//----------------------------------------------------
viewmodel_fov 68
viewmodel_offset_x -0.7
viewmodel_offset_y 1
viewmodel_offset_z -2

cl_prefer_lefthanded false

//----------------------------------------------------
// Crosshair
//----------------------------------------------------
cl_crosshairstyle 4
cl_crosshairsize 1.685552
cl_crosshairthickness 0.487882
cl_crosshairgap -1.693802

cl_crosshair_drawoutline false
cl_crosshair_outlinethickness 0.364738

cl_crosshairdot false
cl_crosshair_t false
cl_crosshair_recoil false

cl_crosshaircolor 5
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 0

cl_crosshairusealpha false
cl_crosshairalpha 200

cl_crosshairgap_useweaponvalue false
cl_fixedcrosshairgap 3

//----------------------------------------------------
// Grenade Crosshair
//----------------------------------------------------
cl_grenadecrosshair_keepusercrosshair true

cl_grenadecrosshair_flash true
cl_grenadecrosshair_smoke true
cl_grenadecrosshair_fire true
cl_grenadecrosshair_explosive true
cl_grenadecrosshair_decoy true

cl_grenadecrosshairdelay_flash 0.997821
cl_grenadecrosshairdelay_smoke 1.000968
cl_grenadecrosshairdelay_fire 1.003560
cl_grenadecrosshairdelay_explosive 0.996231
cl_grenadecrosshairdelay_decoy 1.000572

//----------------------------------------------------
// Gameplay
//----------------------------------------------------
cl_showloadout false
cl_use_opens_buy_menu true
cl_silencer_mode 1
cl_sniper_auto_rezoom true
cl_debounce_zoom true
hud_showtargetid true

//----------------------------------------------------
// Binds
//----------------------------------------------------
bind "w" "+forward"
bind "a" "+left"
bind "s" "+back"
bind "d" "+right"

bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+sprint"

bind "e" "+use"
bind "q" "lastinv"
bind "g" "drop"
bind "f" "+lookatweapon"
bind "h" "switchhands"

bind "TAB" "+showscores"

bind "b" "buymenu"
bind "m" "teammenu"

bind "y" "messagemode"
bind "u" "messagemode2"

bind "t" "+spray_menu"

bind "MOUSE1" "+attack"
bind "MOUSE3" "+voicerecord"
bind "MOUSE4" "+jump"
bind "MOUSE5" "slot2"

bind "MWHEELUP" "+jump;+duck"
bind "MWHEELDOWN" "+jump"

// Weapons
bind "1" "slot1"
bind "3" "slot3"
bind "4" "slot4"

bind "z" "slot6"
bind "v" "slot7"
bind "x" "slot8"
bind "c" "slot10"

// Custom

bind "9" "say ♿"
bind "0" "say ¯\\_(ツ)_/¯"
bind "l" "say GET LEETIFY"

bind "`" "toggleconsole"

// Panorama debug
bind "ENTER" "ent_fire script Enter"
bind "BACKSPACE" "ent_fire script Backspace"
bind "DEL" "ent_fire script Delete"


// Audio
snd_headphone_eq 1
snd_headphone_eq_active 1

snd_autodetect_latency true
snd_mixahead 0.001

snd_gamevolume 1
snd_gamevoicevolume 1
snd_voipvolume 1

snd_musicvolume 1
snd_mute_losefocus true
snd_mute_mvp_music_live_players true

snd_mapobjective_volume 0.041195
snd_mvp_volume 0.040749
snd_tensecondwarning_volume 0.039598

snd_roundstart_volume 0
snd_roundaction_volume 0
snd_roundend_volume 0
snd_deathcamera_volume 0

snd_menumap_volume 0
snd_menumusic_volume 0

snd_spatialize_lerp 0.704497

snd_steamaudio_enable_perspective_correction false

// HUD
cl_drawhud true
cl_drawhud_force_deathnotices 0
cl_drawhud_force_radar 0
cl_drawhud_force_teamid_overhead 0

cl_force_spec_hud_color_to_team false

cl_hud_color 5
cl_hud_radar_background_alpha 0.627
cl_hud_radar_blur_background true
cl_hud_radar_map_additive true
cl_hud_radar_scale 1

cl_hud_telemetry_frametime_show 1
cl_hud_telemetry_net_misdelivery_show 1
cl_hud_telemetry_net_quality_graph_show 0
cl_hud_telemetry_ping_show 1

hud_fastswitch 0
hud_scaling 1.00385
hud_showtargetid true

hidehud 0

// Radar
cl_drawhud_force_radar 0

cl_hud_radar_background_alpha 0.627
cl_hud_radar_blur_background true
cl_hud_radar_map_additive true
cl_hud_radar_scale 1

cl_radar_always_centered true
cl_radar_icon_scale_min 0.6
cl_radar_rotate true

cl_radar_scale 0.267735
cl_radar_scale_alternate 0.337972
cl_radar_scale_dynamic false

cl_radar_show_all_players_when_spectating true

cl_radar_square_always false
cl_radar_square_when_spectating true
cl_radar_square_with_scoreboard true

cl_teammate_colors_show 1

//----------------------------------------------------
// Finished
//----------------------------------------------------
echo "=================================="
echo "      Autoexec Loaded!"
echo "=================================="


